name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64

          - os: ubuntu-24.04-arm
            name: linux-arm64

          - os: windows-2025
            name: windows-x64

          - os: windows-11-arm
            name: windows-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bsparser-${{ matrix.name }}
          path: |
            build/bin/**
            build/lib/**
