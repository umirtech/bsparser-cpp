name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-2025
            name: windows-x64
          - os: windows-11-arm
            name: windows-arm64
    runs-on: ${{ matrix.os }}
    outputs:
      platform: ${{ matrix.name }}
      build: ${{ steps.summary.outputs.build }}
      tests: ${{ steps.summary.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        id: build
        run: cmake --build build --config Release --parallel

      - name: Test (ctest)
        id: test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Summarize
        id: summary
        if: always()
        shell: bash
        run: |
          echo "build=${{ steps.build.outcome }}" >> "$GITHUB_OUTPUT"
          echo "tests=${{ steps.test.outcome }}" >> "$GITHUB_OUTPUT"
